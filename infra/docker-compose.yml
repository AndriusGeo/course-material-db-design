name: db_design_infra

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_design_pgdata:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - db_design_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  metabase:
    image: metabase/metabase:v0.63.14
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - db_design_metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      - db

volumes:
  db_design_pgdata:
  db_design_pgadmin_data:
  db_design_metabase_data:
